    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tawzoon_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();

      // Prevent two-finger pinch-to-zoom on mobile devices
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // iOS / WebKit gesture prevention
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
    </script>

  <body class="bg-white text-slate-900 antialiased selection:bg-emerald-200 selection:text-emerald-950">
    <div id="root"></div>
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
